name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --editable ".[duckdb]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

  compiler:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ['22', '24']
        include:
          - os: windows-latest
            node-version: '24'
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build and run the CLI
        run: npm run build && node dist/main.js --version
      - name: Formatter check
        run: npm run fmt:check
      - name: Editors check
        run: npm run editors:check
      - name: Smoke-run the CLI on real data
        run: npm run smoke
      - name: Set up Python for cross-track parity
        if: runner.os == 'Linux' && matrix.node-version == '22'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install DuckDB for the default-engine parity run
        if: runner.os == 'Linux' && matrix.node-version == '22'
        run: python -m pip install duckdb
      - name: Cross-track parity (TypeScript vs the Python memory engine)
        if: runner.os == 'Linux' && matrix.node-version == '22'
        working-directory: .
        run: bash scripts/parity.sh "node compiler/dist/main.js" "python -m unsequel" "--engine memory"
      - name: Cross-track parity (TypeScript vs the default DuckDB engine)
        if: runner.os == 'Linux' && matrix.node-version == '22'
        working-directory: .
        run: bash scripts/parity.sh "node compiler/dist/main.js" "python -m unsequel" "--engine duckdb"
