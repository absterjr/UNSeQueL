name: Compile exe

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: unsequel-compile-windows-x64.exe
            suffix: windows-x64
          - os: ubuntu-22.04
            asset: unsequel-compile-linux-x64
            suffix: linux-x64
          - os: macos-14
            asset: unsequel-compile-macos-arm64
            suffix: macos-arm64
          - os: macos-15-intel
            asset: unsequel-compile-macos-x64
            suffix: macos-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install compiler dependencies
        run: npm ci
      - name: Build the compile exe and the run-capable bundle (SEA)
        run: node scripts/build-sea.mjs --with-duckdb
      - name: Name the compile exe
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/unsequel-compile.exe "dist/${{ matrix.asset }}"
          else
            mv dist/unsequel-compile "dist/${{ matrix.asset }}"
          fi
      - name: Package the run-capable bundle
        shell: bash
        run: tar -czf "dist/unsequel-run-${{ matrix.suffix }}.tar.gz" -C dist unsequel-run
      - name: Smoke test the compile exe (version, check, compile)
        shell: bash
        run: |
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" check examples/reference/q09_group_count.unsequel
          "dist/${{ matrix.asset }}" compile examples/reference/q09_group_count.unsequel \
            --schema ../examples/spec/schema.json > /dev/null
      - name: Smoke test the run bundle (composition, dates, sinks, no Node)
        shell: bash
        run: |
          RUN_EXE=$([ "$RUNNER_OS" = "Windows" ] && echo unsequel.exe || echo unsequel)
          "dist/unsequel-run/$RUN_EXE" --version
          "dist/unsequel-run/$RUN_EXE" run examples/real/r06_composition.unsequel > /dev/null
          "dist/unsequel-run/$RUN_EXE" run examples/real/r04_monthly_revenue.unsequel > /dev/null
          "dist/unsequel-run/$RUN_EXE" run examples/reference/q09_group_count.unsequel \
            --schema ../examples/spec/schema.json \
            --data orders=../examples/spec/orders.csv --out ../run-out.csv
          head -n 1 ../run-out.csv
          "dist/unsequel-run/$RUN_EXE" run examples/real/r06_composition.unsequel \
            --out ../run-out.parquet
          head -c 4 ../run-out.parquet | grep -q PAR1
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsequel-tools-${{ matrix.suffix }}
          path: |
            compiler/dist/${{ matrix.asset }}
            compiler/dist/unsequel-run-${{ matrix.suffix }}.tar.gz
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/${{ matrix.asset }}" \
            "dist/unsequel-run-${{ matrix.suffix }}.tar.gz" --clobber
