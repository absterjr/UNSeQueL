name: Standalone binaries

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: unsequel-windows-x64.exe
          - os: ubuntu-22.04
            asset: unsequel-linux-x64
          - os: macos-15-intel
            asset: unsequel-macos-x64
          - os: macos-14
            asset: unsequel-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller duckdb
      - name: Build the standalone executable
        run: python -m PyInstaller packaging/unsequel.spec --noconfirm
      - name: Name the release asset
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/unsequel.exe "dist/${{ matrix.asset }}"
          else
            chmod +x dist/unsequel
            mv dist/unsequel "dist/${{ matrix.asset }}"
          fi
      - name: Smoke test the packaged CLI (composition, engine diff, sink)
        shell: bash
        run: |
          BIN="dist/${{ matrix.asset }}"
          "$BIN" --version
          # check/compile must work from the packaged binary too, including
          # column checking through a '# source' directive (bundled DuckDB).
          "$BIN" check compiler/examples/real/r06_composition.unsequel
          "$BIN" compile compiler/examples/real/r06_composition.unsequel > /dev/null
          # DuckDB is bundled, so it is the default engine; the memory engine
          # must agree with it on the composing query and on date functions.
          "$BIN" run compiler/examples/real/r06_composition.unsequel > "$RUNNER_TEMP/r06-duckdb.txt"
          "$BIN" run compiler/examples/real/r06_composition.unsequel --engine memory > "$RUNNER_TEMP/r06-memory.txt"
          diff "$RUNNER_TEMP/r06-memory.txt" "$RUNNER_TEMP/r06-duckdb.txt"
          "$BIN" run compiler/examples/real/r04_monthly_revenue.unsequel > "$RUNNER_TEMP/r04-duckdb.txt"
          "$BIN" run compiler/examples/real/r04_monthly_revenue.unsequel --engine memory > "$RUNNER_TEMP/r04-memory.txt"
          diff "$RUNNER_TEMP/r04-memory.txt" "$RUNNER_TEMP/r04-duckdb.txt"
          "$BIN" run compiler/examples/real/r06_composition.unsequel \
            --out "$RUNNER_TEMP/out.parquet"
          head -c 4 "$RUNNER_TEMP/out.parquet" | grep -q PAR1
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.asset }}" --clobber
