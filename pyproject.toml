[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unsequel"
version = "0.3.0"
description = "UNSeQueL is a FROM-first query language for writing SQL-like queries in logical execution order."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Aryaman Anand" }
]
keywords = ["sql", "query-language", "from-first", "execution-order", "data", "pipeline", "duckdb"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = []

[project.urls]
Homepage = "https://absterjr.github.io/UNSeQueL/"
Repository = "https://github.com/absterjr/UNSeQueL"
Changelog = "https://github.com/absterjr/UNSeQueL/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# DuckDB is only needed to run the SQL-codegen execution-parity tests and the
# `run`/`preview` commands against a real engine. The core stays dependency-free.
duckdb = ["duckdb>=0.10"]

[project.scripts]
unsequel-python = "unsequel.cli:main"

[tool.setuptools.packages.find]
include = ["unsequel*"]
