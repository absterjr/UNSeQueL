[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unsequel"
version = "0.4.0"
description = "A beginner-friendly query language written in logical execution order."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Aryaman Anand" }
]
dependencies = []

[project.optional-dependencies]
# DuckDB is only needed to run the SQL-codegen execution-parity tests and the
# `run`/`preview` commands against a real engine. The core stays dependency-free.
duckdb = ["duckdb>=0.10"]

[project.scripts]
unsequel = "unsequel.cli:main"

[tool.setuptools.packages.find]
include = ["unsequel*"]
