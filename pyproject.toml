[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unsequel"
version = "0.2.0"
description = "A beginner-friendly query language written in logical execution order."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Aryaman Anand" }
]
dependencies = []

[project.scripts]
unsequel = "unsequel.cli:main"

[tool.setuptools.packages.find]
include = ["unsequel*"]
