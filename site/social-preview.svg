<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">UNSeQueL — Write queries in the order they run</title>
  <desc id="desc">A FROM-first query language with composable stages, DuckDB execution, and a VS Code extension.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#17374a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#bef264"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>
  <circle cx="1120" cy="30" r="300" fill="#5eead4" opacity=".06"/>
  <text x="76" y="86" fill="#bef264" font-family="Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="5">FROM-FIRST · STAGE-BY-STAGE · DUCKDB</text>
  <text x="76" y="173" fill="#edf4ff" font-family="Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-2">UNSeQueL</text>
  <rect x="76" y="197" width="240" height="6" rx="3" fill="url(#accent)"/>
  <text x="76" y="260" fill="#edf4ff" font-family="Arial,sans-serif" font-size="38" font-weight="600">Write queries in the order they run.</text>
  <text x="76" y="307" fill="#a9b8cc" font-family="Arial,sans-serif" font-size="23">A FROM-first language for SQL-like data transformations.</text>
  <rect x="76" y="363" width="520" height="205" rx="18" fill="#172235" stroke="#2b3a50" stroke-width="2"/>
  <text x="104" y="405" fill="#a9b8cc" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">A QUERY, TOP TO BOTTOM</text>
  <text x="104" y="449" fill="#5eead4" font-family="Consolas,monospace" font-size="23">from orders</text>
  <text x="104" y="483" fill="#edf4ff" font-family="Consolas,monospace" font-size="23">filter quantity &gt; 0</text>
  <text x="104" y="517" fill="#edf4ff" font-family="Consolas,monospace" font-size="23">group by country</text>
  <text x="104" y="551" fill="#bef264" font-family="Consolas,monospace" font-size="23">aggregate revenue = SUM(...)</text>
  <rect x="626" y="363" width="578" height="205" rx="18" fill="#172235" stroke="#2b3a50" stroke-width="2"/>
  <text x="662" y="421" fill="#5eead4" font-family="Arial,sans-serif" font-size="24" font-weight="700">DuckDB compiler</text>
  <text x="662" y="466" fill="#a9b8cc" font-family="Arial,sans-serif" font-size="21">CLI · interactive REPL · line selections</text>
  <text x="662" y="504" fill="#a9b8cc" font-family="Arial,sans-serif" font-size="21">VS Code syntax + run commands</text>
  <text x="662" y="542" fill="#bef264" font-family="Arial,sans-serif" font-size="19">Open source · MIT · feedback welcome</text>
</svg>
